

[project]
name = "empmcp-server"
version = "0.1.0"
description = "EmpMCP server (FastMCP, streamable HTTP) backed by Oracle"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.9",
    "cryptography>=42",
    "oracledb>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
empmcp = "empmcp.server:main"



